<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LifeOS — Stat Wheel</title>
<style>
:root{--color-bg:#0f0f11;--color-fg:#ededec;--color-accent:oklch(0.72 0.14 145);--color-accent-fg:oklch(0.86 0.12 145);--color-gold:oklch(0.80 0.13 88)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--color-bg);color:var(--color-fg);display:grid;place-items:center;font-family:Georgia,"Iowan Old Style","Times New Roman",serif}
#root{width:min(560px,94vw)}
svg{display:block;width:100%}
</style></head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const { useState } = React;
const MAX = 5, ACC = "var(--color-accent-fg)", GOLD = "var(--color-gold)", INK = "var(--color-fg)", NODE = "var(--color-bg)";
const CX = 210, CY = 215, R = 176, CORE = 58, HALF = 17, RTIP = R - 23;
const polar = (deg, rad) => { const a = deg * Math.PI / 180; return { x: CX + rad * Math.cos(a), y: CY + rad * Math.sin(a) }; };

const ICONS = {
  lens: (<React.Fragment>
    <path d="M-2.2,-8.2 C-6,-11.2 -9.5,-11.6 -13,-10.6 v17.4 C-9.5,5.8 -6,6.2 -2.2,9.2 Z" />
    <path d="M2.2,-8.2 C6,-11.2 9.5,-11.6 13,-10.6 v17.4 C9.5,5.8 6,6.2 2.2,9.2 Z" />
    <rect x="-0.9" y="-8.4" width="1.8" height="17.8" rx="0.9" opacity="0.85" />
  </React.Fragment>),
  bell: (<React.Fragment>
    <rect x="-14" y="-2.6" width="28" height="5.2" rx="1.4" />
    <rect x="-17" y="-9.5" width="5.5" height="19" rx="1.8" />
    <rect x="11.5" y="-9.5" width="5.5" height="19" rx="1.8" />
  </React.Fragment>),
  heart: <path d="M0,11 C-11,3 -13,-4 -8.5,-8.5 C-4.5,-12.5 -0.5,-9 0,-6 C0.5,-9 4.5,-12.5 8.5,-8.5 C13,-4 11,3 0,11 Z" />,
  hammer: (<g transform="rotate(-22)">
    <rect x="-13" y="-14" width="26" height="9.5" rx="2.2" />
    <rect x="-2.6" y="-5" width="5.2" height="21" rx="2" />
  </g>),
  moon: <path d="M8.5,9.5 A13,13 0 1 1 8.5,-9.5 A10.5,10.5 0 1 0 8.5,9.5 Z" transform="rotate(-20)" />,
};

const NODES = [
  { name: "Mind", icon: "lens" },
  { name: "Body", icon: "bell" },
  { name: "Bonds", icon: "heart" },
  { name: "Craft", icon: "hammer" },
  { name: "Calm", icon: "moon" },
].map((s, i) => { const deg = -90 + i * 72, p = polar(deg, R); return { ...s, i, deg, x: p.x, y: p.y }; });

function StatWheel() {
  const [levels, setLevels] = useState([3, 2, 4, 0, 3]);
  const bump = (i) => setLevels((ls) => ls.map((l, k) => (k === i ? (l >= MAX ? 0 : l + 1) : l)));

  const gaps = [];
  let cur = -90 - HALF;
  NODES.forEach((n) => { if (levels[n.i] > 0) { gaps.push([cur, n.deg - HALF]); cur = n.deg + HALF; } });
  gaps.push([cur, 270 - HALF]);

  return (
    <svg viewBox="6 11 408 408">
      <defs><filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
      </filter></defs>

      <circle cx={CX} cy={CY} r={CORE} fill="var(--color-accent)" fillOpacity="0.3" />
      {gaps.filter(([a, b]) => b - a > 0.6).map(([a, b], i) => {
        const p0 = polar(a, CORE), p1 = polar(b, CORE);
        return <path key={i} d={`M${p0.x.toFixed(1)} ${p0.y.toFixed(1)} A${CORE} ${CORE} 0 ${b - a > 180 ? 1 : 0} 1 ${p1.x.toFixed(1)} ${p1.y.toFixed(1)}`} fill="none" stroke={ACC} strokeWidth="1.1" />;
      })}

      {[CORE, 92, 134, R].map((rad, k) => (
        <circle key={rad} cx={CX} cy={CY} r={rad} fill="none" stroke={k === 3 ? ACC : INK}
          strokeWidth={k === 3 ? 2.4 : 0.9} opacity={k === 3 ? 0.75 : 0.14} strokeDasharray={k === 1 ? "2 7" : undefined} />
      ))}

      {NODES.map((n) => {
        const lv = levels[n.i], s = lv / MAX;
        const bL = polar(n.deg - HALF, CORE), bR = polar(n.deg + HALF, CORE);
        const t = (CORE + (RTIP - CORE) * s) / R;
        const apex = { x: CX + (n.x - CX) * t, y: CY + (n.y - CY) * t };
        const tri = (p) => `M${bL.x.toFixed(1)},${bL.y.toFixed(1)} L${p.x.toFixed(1)},${p.y.toFixed(1)} L${bR.x.toFixed(1)},${bR.y.toFixed(1)}`;
        return (
          <g key={n.name}>
            <line x1={CX} y1={CY} x2={n.x} y2={n.y} stroke={lv >= 4 ? ACC : INK} strokeWidth={0.8 + s * 1.9} opacity={0.22 + s * 0.62} />
            <path d={`${tri(polar(n.deg, RTIP))} Z`} fill="none" stroke={INK} strokeWidth="0.8" opacity="0.22" strokeLinejoin="round" />
            {lv > 0 && (<React.Fragment>
              <path d={`${tri(apex)} Z`} fill="var(--color-accent)" fillOpacity="0.3" />
              <path d={tri(apex)} fill="none" stroke={ACC} strokeWidth="1.1" strokeLinejoin="round" />
            </React.Fragment>)}
            {Array.from({ length: MAX }, (_, k) => {
              const q = polar(n.deg, CORE + (k + 1) * ((RTIP - CORE) / (MAX + 1)));
              const earned = k < lv;
              return <circle key={k} cx={q.x} cy={q.y} r={earned ? 2.1 : 1.6} fill={earned ? ACC : INK} opacity={earned ? 0.85 : 0.28} />;
            })}
          </g>
        );
      })}

      {NODES.map((n) => {
        const lv = levels[n.i], pct = lv / MAX, C = 2 * Math.PI * 19;
        const maxed = lv >= MAX, ring = maxed ? GOLD : ACC;
        return (
          <g key={n.name} onClick={() => bump(n.i)} style={{ cursor: "pointer" }}>
            {maxed && <circle cx={n.x} cy={n.y} r="25" fill={GOLD} opacity="0.16" />}
            <circle cx={n.x} cy={n.y} r="22" fill={NODE} opacity="0.9" />
            <circle cx={n.x} cy={n.y} r="19" fill="none" stroke={INK} strokeOpacity="0.32" strokeWidth="1" />
            <circle cx={n.x} cy={n.y} r="19" fill="none" stroke={ring} strokeWidth={maxed ? 3 : 2.6} strokeLinecap="round"
              strokeDasharray={`${C * pct} ${C}`} transform={`rotate(-90 ${n.x} ${n.y})`} />
            <g transform={`translate(${n.x} ${n.y}) scale(0.6)`} fill={maxed ? GOLD : lv >= 3 ? ACC : INK}
              color={maxed ? GOLD : lv >= 3 ? ACC : INK} opacity={maxed ? 1 : 0.45 + pct * 0.55}>{ICONS[n.icon]}</g>
            <circle cx={n.x} cy={n.y} r="26" fill="transparent" />
          </g>
        );
      })}

      <circle cx={CX} cy={CY} r="7" fill="none" stroke={INK} strokeWidth="1.4" opacity="0.8" />
      <circle cx={CX} cy={CY} r="2.2" fill={INK} />
      <rect x="6" y="11" width="408" height="408" filter="url(#grain)" opacity="0.12" style={{ mixBlendMode: "overlay" }} pointerEvents="none" />
    </svg>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<StatWheel />);
</script>
</body></html>
